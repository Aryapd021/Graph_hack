services:
  - type: web
    name: company-brain
    env: docker
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: SERVE_STATIC
        value: "true"
      - key: DEMO_MODE
        value: "true"
      - key: ENABLE_INGEST_REFRESH
        value: "false"
      - key: GEMINI_MODEL
        value: "gemini-3.5-flash-lite"
      - key: GEMINI_EMBED_MODEL
        value: "text-embedding-004"
      - key: EMBED_DIM
        value: "768"
      - key: FALKORDB_SSL
        value: "true"
      - key: FALKORDB_GRAPH
        value: "company_brain"
